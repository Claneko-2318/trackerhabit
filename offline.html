<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#523F77">
  <title>Tracker personale — Offline</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{display:grid;place-items:center;padding:24px;background:#f7f3fa;color:#332b46;font-family:Arial,Helvetica,sans-serif}
    main{width:min(520px,100%);padding:30px;border:1px solid #e8e1ee;border-radius:26px;background:#fff;box-shadow:0 16px 42px rgba(82,63,119,.13);text-align:center}
    img{width:82px;height:82px;border-radius:22px}
    h1{margin:18px 0 10px;font-size:32px}
    p{margin:0 0 20px;color:#766d88;line-height:1.55}
    .actions{display:grid;gap:10px}
    button,a{width:100%;min-height:46px;border-radius:14px;padding:12px 16px;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}
    button{border:0;background:#523f77;color:#fff}
    a{display:grid;place-items:center;border:1px solid #e8e1ee;color:#523f77;background:#fff}
  </style>
</head>
<body data-offline-page>
  <main>
    <img src="icons/icon-192.png" alt="">
    <h1>Sei offline</h1>
    <p>Le pagine già salvate sul dispositivo restano disponibili. Meteo e sincronizzazione con Google Sheets riprenderanno quando tornerà la connessione.</p>
    <div class="actions">
      <button type="button" onclick="location.reload()">Riprova</button>
      <a href="index.html">Apri la Home</a>
    </div>
  </main>
</body>
</html>
